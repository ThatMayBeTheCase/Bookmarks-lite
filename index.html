<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bookmarks Lite</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="container">
    <h1>Bookmarks <span id="dot">.</span></h1>
    <p class="tagline">Save, open and keep track of your bookmarks.</p>
  </header>

  <main class="container">
    <form id="bookmark-form" novalidate>

      <label>
        Title
        <input id="title" name="title" type="text" required />
      </label>

      <label>
        URL
        <input id="url" name="url" type="url" required />
      </label>

      <button type="submit">Add Bookmark</button>
      <p id="form-error" aria-live="polite" class="error"></p>
    </form>

    <section id="bookmark-section">
      <h2>My Bookmarks</h2>
      <p id="empty-state">No bookmarks yet.</p>
      <ul id="bookmark-list" aria-live="polite"></ul>
    </section>

  <script src="assets/js/script.js" defer></script>
</body>
</html>
